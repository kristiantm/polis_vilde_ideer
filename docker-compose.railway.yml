version: '3.8'

services:
  server:
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - PORT=${PORT:-5000}
      - NODE_ENV=production
      - DEV_MODE=false
      - API_PROD_HOSTNAME=${RAILWAY_PUBLIC_DOMAIN}
      - EMBED_SERVICE_HOSTNAME=${RAILWAY_PUBLIC_DOMAIN}
      - DOMAIN_OVERRIDE=${RAILWAY_PUBLIC_DOMAIN}
      - SERVICE_URL=https://${RAILWAY_PUBLIC_DOMAIN}
      - ADMIN_UIDS=${ADMIN_UIDS:-[]}
      - EMAIL_TRANSPORT_TYPES=${EMAIL_TRANSPORT_TYPES:-maildev}
      - MATH_ENV=${MATH_ENV:-prod}
      - MATH_LOG_LEVEL=${MATH_LOG_LEVEL:-warn}
      - SERVER_LOG_LEVEL=${SERVER_LOG_LEVEL:-warn}
      - CACHE_MATH_RESULTS=${CACHE_MATH_RESULTS:-true}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      - SHOULD_USE_TRANSLATION_API=${SHOULD_USE_TRANSLATION_API:-false}
      - AKISMET_ANTISPAM_API_KEY=${AKISMET_ANTISPAM_API_KEY}
      - GA_TRACKING_ID=${GA_TRACKING_ID}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_JIGSAW_PERSPECTIVE_API_KEY=${GOOGLE_JIGSAW_PERSPECTIVE_API_KEY}
      - POLIS_FROM_ADDRESS=${POLIS_FROM_ADDRESS:-"Polis <noreply@polis.com>"}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-[]}
      - WEBSERVER_USERNAME=${WEBSERVER_USERNAME:-ws-user}
      - WEBSERVER_PASS=${WEBSERVER_PASS:-ws-pass}
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
      args:
        NODE_ENV: production
    labels:
      polis_tag: ${TAG:-railway}
    depends_on:
      - "file-server"
    networks:
      - "polis-net"
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v3/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  math:
    build:
      context: ./math
    labels:
      polis_tag: ${TAG:-railway}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOGGING_LEVEL=${MATH_LOG_LEVEL:-warn}
      - MATH_ENV=${MATH_ENV:-prod}
      - WEBSERVER_USERNAME=${WEBSERVER_USERNAME:-ws-user}
      - WEBSERVER_PASS=${WEBSERVER_PASS:-ws-pass}
    networks:
      - "polis-net"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  delphi:
    build:
      context: ./delphi
    labels:
      polis_tag: ${TAG:-railway}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${DELPHI_LOG_LEVEL:-INFO}
      - DELPHI_DEV_OR_PROD=${DELPHI_DEV_OR_PROD:-prod}
      - POLL_INTERVAL=${POLL_INTERVAL:-2}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-polis-delphi}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - DATABASE_HOST=${POSTGRES_HOST}
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE}
      - NUMBA_DISABLE_JIT=${NUMBA_DISABLE_JIT:-1}
    networks:
      - "polis-net"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "job_poller.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  file-server:
    build:
      context: ./
      dockerfile: file-server/Dockerfile
      args:
        EMBED_SERVICE_HOSTNAME: ${RAILWAY_PUBLIC_DOMAIN}
        GA_TRACKING_ID: ${GA_TRACKING_ID}
        GIT_HASH: "${GIT_HASH:-placeholder}"
        NODE_ENV: production
    labels:
      polis_tag: ${TAG:-railway}
    environment:
      - PORT=${STATIC_FILES_PORT:-8080}
    networks:
      - "polis-net"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx-proxy:
    build:
      context: ./file-server
      dockerfile: nginx.Dockerfile
    labels:
      polis_tag: ${TAG:-railway}
    depends_on:
      - "server"
      - "file-server"
    networks:
      - "polis-net"
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  polis-net:
    driver: bridge 